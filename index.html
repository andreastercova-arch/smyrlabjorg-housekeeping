<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Housekeeping</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f4f5f7;
  color: #222;
}

/* HEADER */
header {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: white;
  padding: 12px 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.title {
  font-size: 22px;
  font-weight: bold;
}

.date {
  font-size: 13px;
  color: #777;
  margin-top: 3px;
}

.header-buttons {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

button {
  border: none;
  border-radius: 7px;
  padding: 7px 10px;
  font-size: 12px;
  cursor: pointer;
  font-weight: bold;
}

.occupied-all {
  background: #ffe0e0;
  color: #a00000;
}

.reset {
  background: #eeeeee;
  color: #444;
}

/* MAIN */
.main {
  max-width: 1200px;
  margin: auto;
  padding: 12px;
}

/* SUMMARY */
.summary {
  background: white;
  border-radius: 10px;
  padding: 10px 12px;
  margin-bottom: 10px;
  box-shadow: 0 2px 7px rgba(0,0,0,0.05);
  font-size: 13px;
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

.summary span {
  white-space: nowrap;
}

/* SECTIONS */
.section {
  background: white;
  border-radius: 10px;
  margin-bottom: 12px;
  padding: 10px;
  box-shadow: 0 2px 7px rgba(0,0,0,0.05);
}

.section-title {
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 8px;
}

/* ROOMS */
.rooms {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(62px, 1fr));
  gap: 6px;
}

.room {
  min-height: 54px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 13px;
  cursor: pointer;
  user-select: none;
  position: relative;
  transition: transform 0.08s ease;
}

.room:active {
  transform: scale(0.96);
}

/* STATUS COLORS */
.room.empty {
  background: #f0f1f3;
  color: #555;
}

.room.occupied {
  background: #ffd7d7;
  color: #a00000;
}

.room.checkout {
  background: #d8f5dc;
  color: #176b25;
}

.room.stayover {
  background: #eadcff;
  color: #5b2492;
}

.room.done {
  background: #c9f3d0;
  color: #176b25;
}

/* LEGEND */
.legend {
  background: white;
  border-radius: 10px;
  padding: 10px 12px;
  margin-top: 4px;
  margin-bottom: 15px;
  box-shadow: 0 2px 7px rgba(0,0,0,0.05);
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  font-size: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
}

.legend-dot {
  width: 13px;
  height: 13px;
  border-radius: 4px;
  display: inline-block;
}

.dot-occupied {
  background: #ffd7d7;
}

.dot-checkout {
  background: #d8f5dc;
}

.dot-stayover {
  background: #eadcff;
}

.dot-done {
  background: #c9f3d0;
}

/* =====================================================
   GLOBAL DROPDOWN MENU
   ===================================================== */

.global-menu {
  position: fixed;

  /* THIS IS THE IMPORTANT PART */
  z-index: 2147483647;

  display: none;

  background: white;
  border-radius: 9px;
  padding: 5px;

  box-shadow:
    0 8px 25px rgba(0,0,0,0.22),
    0 2px 8px rgba(0,0,0,0.15);

  min-width: 145px;

  border: 1px solid #ddd;

  max-height: calc(100vh - 10px);
  overflow-y: auto;
}

/* little options */
.global-menu button {
  display: block;
  width: 100%;
  text-align: left;

  background: white;
  color: #222;

  padding: 9px 10px;
  margin: 0;

  font-size: 13px;
  font-weight: normal;

  border-radius: 6px;
}

.global-menu button:hover {
  background: #f1f1f1;
}

.global-menu .menu-occupied {
  color: #a00000;
}

.global-menu .menu-checkout {
  color: #176b25;
}

.global-menu .menu-stayover {
  color: #5b2492;
}

.global-menu .menu-done {
  color: #176b25;
}

.global-menu .menu-empty {
  color: #555;
}

/* MOBILE */
@media (max-width: 600px) {

  header {
    padding: 10px;
  }

  .title {
    font-size: 19px;
  }

  .main {
    padding: 8px;
  }

  .section {
    padding: 8px;
  }

  .rooms {
    grid-template-columns: repeat(5, 1fr);
    gap: 5px;
  }

  .room {
    min-height: 48px;
    font-size: 12px;
  }

  .summary {
    gap: 8px;
  }

  .legend {
    gap: 8px;
  }
}
</style>
</head>

<body>

<header>

  <div class="header-top">

    <div>
      <div class="title">Housekeeping</div>
      <div class="date" id="date"></div>
    </div>

    <div class="header-buttons">
      <button class="occupied-all" onclick="occupiedAll()">
        🔴 Occupied all
      </button>

      <button class="reset" onclick="resetAll()">
        Reset all
      </button>
    </div>

  </div>

</header>


<div class="main">

  <div class="summary" id="summary"></div>

  <div id="app"></div>

  <div class="legend">

    <div class="legend-item">
      <span class="legend-dot dot-occupied"></span>
      🔴 Occupied
    </div>

    <div class="legend-item">
      <span class="legend-dot dot-checkout"></span>
      🟢 Check out
    </div>

    <div class="legend-item">
      <span class="legend-dot dot-stayover"></span>
      🟣 Stayover
    </div>

    <div class="legend-item">
      <span class="legend-dot dot-done"></span>
      ✅ Hotovo
    </div>

  </div>

</div>


<!-- =====================================================
     GLOBAL MENU

     IMPORTANT:
     This is directly inside BODY, NOT inside a room.
     Therefore it can appear above the entire page.
     ===================================================== -->

<div id="globalMenu" class="global-menu"></div>


<script>

/* =====================================================
   ROOMS
   ===================================================== */

const sections = [

  {
    name: "LUXURY 1–8",
    rooms: [1,2,3,4,5,6,7,8]
  },

  {
    name: "CORRIDOR 1",
    rooms: [101,102,103,104,105,106,107,108,109,110]
  },

  {
    name: "CORRIDOR 2",
    rooms: [111,112,113,114,115,116,117,118,119,120]
  },

  {
    name: "CORRIDOR 3",
    rooms: [121,122,123,124,125,126,127,128,129,130,131,132]
  },

  {
    name: "CORRIDOR 4",
    rooms: [133,134,135,136,137,138,139,140,141,142,143,144,145,146]
  },

  {
    name: "CORRIDOR 5",
    rooms: [147,148,149,150,151,152,153,154,155,156,157,158,159,160]
  }

];


/* =====================================================
   STATUS NAMES
   ===================================================== */

const statusNames = {

  empty: "",

  occupied: "Occupied",

  checkout: "Check out",

  stayover: "Stayover",

  done: "✓ Hotovo"

};


/* =====================================================
   SAVED STATE
   ===================================================== */

let states =
  JSON.parse(localStorage.getItem("housekeepingStates")) || {};


/* =====================================================
   CURRENT MENU
   ===================================================== */

let currentMenuRoom = null;
let currentMenuRoomElement = null;


/* =====================================================
   SAVE
   ===================================================== */

function save() {

  localStorage.setItem(
    "housekeepingStates",
    JSON.stringify(states)
  );

}


/* =====================================================
   RENDER
   ===================================================== */

function render() {

  const app = document.getElementById("app");

  app.innerHTML = "";

  sections.forEach(section => {

    const sectionDiv = document.createElement("div");

    sectionDiv.className = "section";


    const title = document.createElement("div");

    title.className = "section-title";

    title.textContent = section.name;


    const roomsDiv = document.createElement("div");

    roomsDiv.className = "rooms";


    section.rooms.forEach(room => {

      const roomDiv = document.createElement("div");

      roomDiv.className =
        "room " + (states[room] || "empty");

      roomDiv.textContent = room;


      /*
       First click:
       ONLY opens menu.
      */

      roomDiv.addEventListener("click", function(event) {

        event.stopPropagation();

        openMenu(room, roomDiv);

      });


      roomsDiv.appendChild(roomDiv);

    });


    sectionDiv.appendChild(title);

    sectionDiv.appendChild(roomsDiv);

    app.appendChild(sectionDiv);

  });


  updateSummary();

}


/* =====================================================
   OPEN GLOBAL MENU
   ===================================================== */

function openMenu(room, roomElement) {

  closeMenu();


  currentMenuRoom = room;

  currentMenuRoomElement = roomElement;


  const menu = document.getElementById("globalMenu");


  menu.innerHTML = `

    <button class="menu-occupied"
      onclick="selectStatus('occupied', event)">
      🔴 Occupied
    </button>

    <button class="menu-checkout"
      onclick="selectStatus('checkout', event)">
      🟢 Check out
    </button>

    <button class="menu-stayover"
      onclick="selectStatus('stayover', event)">
      🟣 Stayover
    </button>

    <button class="menu-done"
      onclick="selectStatus('done', event)">
      ✅ Hotovo
    </button>

    <button class="menu-empty"
      onclick="selectStatus('empty', event)">
      ◻ Empty
    </button>

  `;


  /*
    Show menu temporarily so we can
    measure its real width.
  */

  menu.style.display = "block";

  menu.style.visibility = "hidden";


  positionMenu();


  menu.style.visibility = "visible";

}


/* =====================================================
   POSITION MENU
   ===================================================== */

function positionMenu() {

  if (!currentMenuRoomElement) return;


  const menu =
    document.getElementById("globalMenu");


  const room =
    currentMenuRoomElement.getBoundingClientRect();


  const menuWidth =
    menu.offsetWidth;


  /*
    Center menu underneath room.
  */

  let left =
    room.left +
    (room.width / 2) -
    (menuWidth / 2);


  /*
    Don't let menu go outside
    left/right side of screen.
  */

  left = Math.max(
    5,
    Math.min(
      left,
      window.innerWidth - menuWidth - 5
    )
  );


  /*
    ALWAYS DOWN.

    We intentionally do NOT flip
    the menu upwards.
  */

  const top =
    room.bottom + 6;


  menu.style.left =
    left + "px";


  menu.style.top =
    top + "px";


  /*
    If there isn't enough space below,
    allow the menu itself to scroll.
    It still opens DOWN.
  */

  const availableHeight =
    window.innerHeight - top - 10;


  if (availableHeight > 80) {

    menu.style.maxHeight =
      availableHeight + "px";

  } else {

    menu.style.maxHeight =
      "80px";

  }

}


/* =====================================================
   SELECT STATUS
   ===================================================== */

function selectStatus(status, event) {

  if (event) {

    event.stopPropagation();

  }


  if (currentMenuRoom !== null) {

    if (status === "empty") {

      delete states[currentMenuRoom];

    } else {

      states[currentMenuRoom] = status;

    }

    save();

  }


  closeMenu();

  render();

}


/* =====================================================
   CLOSE MENU
   ===================================================== */

function closeMenu() {

  const menu =
    document.getElementById("globalMenu");


  menu.style.display = "none";


  menu.style.visibility = "hidden";


  currentMenuRoom = null;

  currentMenuRoomElement = null;

}


/* =====================================================
   CLICK OUTSIDE
   ===================================================== */

document.addEventListener("click", function(event) {

  const menu =
    document.getElementById("globalMenu");


  /*
    If click isn't inside menu,
    close it.
  */

  if (!menu.contains(event.target)) {

    closeMenu();

  }

});


/* =====================================================
   KEEP MENU ATTACHED TO ROOM
   ===================================================== */

window.addEventListener(
  "scroll",
  function() {

    if (currentMenuRoom !== null) {

      positionMenu();

    }

  },
  true
);


window.addEventListener(
  "resize",
  function() {

    if (currentMenuRoom !== null) {

      positionMenu();

    }

  }
);


/* =====================================================
   OCCUPIED ALL
   ===================================================== */

function occupiedAll() {

  const confirmed =
    confirm(
      "Set ALL rooms to Occupied?\n\n" +
      "This will change the status of every room."
    );


  if (!confirmed) return;


  sections.forEach(section => {

    section.rooms.forEach(room => {

      states[room] = "occupied";

    });

  });


  save();

  render();

}


/* =====================================================
   RESET ALL
   ===================================================== */

function resetAll() {

  const confirmed =
    confirm(
      "Reset ALL room statuses?\n\n" +
      "This cannot be undone."
    );


  if (!confirmed) return;


  states = {};

  save();

  render();

}


/* =====================================================
   SUMMARY
   ===================================================== */

function updateSummary() {

  let total = 0;

  let done = 0;

  let checkout = 0;

  let stayover = 0;

  let occupied = 0;


  sections.forEach(section => {

    section.rooms.forEach(room => {

      total++;


      if (states[room] === "done") {
        done++;
      }

      if (states[room] === "checkout") {
        checkout++;
      }

      if (states[room] === "stayover") {
        stayover++;
      }

      if (states[room] === "occupied") {
        occupied++;
      }

    });

  });


  document.getElementById("summary").innerHTML = `

    <span><strong>${total}</strong> rooms</span>

    <span>🔴 ${occupied}</span>

    <span>🟢 ${checkout}</span>

    <span>🟣 ${stayover}</span>

    <span>✅ ${done}</span>

  `;

}


/* =====================================================
   DATE
   ===================================================== */

document.getElementById("date").textContent =
  new Date().toLocaleDateString(
    "en-GB",
    {
      weekday: "long",
      day: "numeric",
      month: "long",
      year: "numeric"
    }
  );


/* =====================================================
   START
   ===================================================== */

render();

</script>

</body>
</html>
